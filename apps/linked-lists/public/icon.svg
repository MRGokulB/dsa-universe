<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dsaBgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1220"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="dsaBorderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="dsaNeonGrad" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="dsaCoreGrad" x1="200" y1="200" x2="312" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="dsaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Obsidian Squircle Badge -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#dsaBgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" stroke="url(#dsaBorderGrad)" stroke-width="12"/>

  <!-- Silicon Die Circuit Traces -->
  <line x1="256" y1="48" x2="256" y2="120" stroke="#1E293B" stroke-width="4" stroke-dasharray="6 6"/>
  <line x1="256" y1="392" x2="256" y2="464" stroke="#1E293B" stroke-width="4" stroke-dasharray="6 6"/>
  <line x1="48" y1="256" x2="120" y2="256" stroke="#1E293B" stroke-width="4" stroke-dasharray="6 6"/>
  <line x1="392" y1="256" x2="464" y2="256" stroke="#1E293B" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- Algorithmic Silicon Lattice (Faceted Hexagonal Tree / Graph Core) -->
  <g filter="url(#dsaGlow)">
    <!-- Outer Hexagonal Bus Lines -->
    <path d="M256 120 L380 188 V324 L256 392 L132 324 V188 Z" stroke="url(#dsaNeonGrad)" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Interior Tri-Axial Graph Conduits -->
    <line x1="256" y1="256" x2="256" y2="120" stroke="url(#dsaNeonGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="380" y2="324" stroke="url(#dsaNeonGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="132" y2="324" stroke="url(#dsaNeonGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="380" y2="188" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="132" y2="188" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="256" y2="392" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>

    <!-- Vertex Memory Nodes -->
    <circle cx="256" cy="120" r="22" fill="#38BDF8"/>
    <circle cx="380" cy="188" r="22" fill="#818CF8"/>
    <circle cx="380" cy="324" r="22" fill="#A855F7"/>
    <circle cx="256" cy="392" r="22" fill="#6366F1"/>
    <circle cx="132" cy="324" r="22" fill="#38BDF8"/>
    <circle cx="132" cy="188" r="22" fill="#818CF8"/>

    <!-- Central Silicon Processor Core -->
    <rect x="226" y="226" width="60" height="60" rx="14" fill="#090D16" stroke="url(#dsaNeonGrad)" stroke-width="8"/>
    <circle cx="256" cy="256" r="14" fill="url(#dsaCoreGrad)"/>
  </g>
</svg>